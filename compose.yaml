services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carhire
      POSTGRES_USER: carhire
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carhire-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carhire"]
      interval: 5s
      retries: 10
volumes:
  carhire-db:
