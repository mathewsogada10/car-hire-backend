spring:
  application:
    name: car-hire
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/carhire}
    username: ${DATABASE_USER:carhire}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
carhire:
  owner: ${OWNER_USERNAME:owner}
  password: ${OWNER_PASSWORD}
  storage: ${ATTACHMENT_STORAGE:./storage}
